plugins {
	id 'org.springframework.boot' version '4.0.5' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.mitrian'
	version = '0.0.1-SNAPSHOT'
	repositories {
		mavenCentral()
	}
}

subprojects { proj ->
	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}
