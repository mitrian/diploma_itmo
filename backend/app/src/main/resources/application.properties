spring.application.name=diploma
server.port=8080

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diploma}
spring.datasource.username=${DB_USER:diploma}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}

voting.stage-one-timeout-seconds=${VOTING_STAGE_ONE_TIMEOUT_SECONDS:720}
voting.stage-two-timeout-seconds=${VOTING_STAGE_TWO_TIMEOUT_SECONDS:180}
voting.timeout-check-interval-ms=${VOTING_TIMEOUT_CHECK_INTERVAL_MS:5000}
