spring.application.name=kudago-import
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diploma}
spring.datasource.username=${DB_USER:diploma}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

diploma.kudago-import.http-import-token=${DIPLOMA_KUDAGOIMPORT_HTTPIMPORTTOKEN:dev-kudago-import-diploma-local}
diploma.kudago-import.center-lat=${DIPLOMA_KUDAGOIMPORT_CENTERLAT:59.956346}
diploma.kudago-import.center-lon=${DIPLOMA_KUDAGOIMPORT_CENTERLON:30.309968}
diploma.kudago-import.radius-meters=${DIPLOMA_KUDAGOIMPORT_RADIUSMETERS:4000}

# Плановый импорт (раз в месяц по умолчанию). Отключить: false
diploma.kudago-import.scheduled-import-enabled=${DIPLOMA_KUDAGOIMPORT_SCHEDULEDIMPORTENABLED:true}
# Spring: сек мин час день_месяца месяц день_недели (? — без указания дня недели)
diploma.kudago-import.scheduled-import-cron=${DIPLOMA_KUDAGOIMPORT_SCHEDULEDIMPORTCRON:0 0 4 1 * ?}
diploma.kudago-import.scheduled-import-zone=${DIPLOMA_KUDAGOIMPORT_SCHEDULEDIMPORTZONE:Europe/Moscow}
